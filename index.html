<title>AIDAS-A100 storage panopticon</title>
<style>
:root { --fg:#1f2328; --muted:#656d76; --bg:#ffffff; --card:#f6f8fa; --border:#d0d7de; --track:#e6e8eb;
        --bar:#3b82f6; --warn:#d97706; --crit:#dc2626; --good:#16a34a;
        --c-root:#4b535d; --c-data0:#08519c; --c-data1:#3182bd; --c-data2:#6baed6; --c-shared:#e69f00; --c-net:#009e73; }
@media (prefers-color-scheme: dark) {
  :root { --fg:#e6edf3; --muted:#8d96a0; --bg:#0d1117; --card:#161b22; --border:#30363d; --track:#30363d;
          --bar:#4c8df6; --warn:#f0a020; --crit:#f85149; --good:#3fb950;
          --c-root:#c9d1d9; --c-data0:#2f7fc1; --c-data1:#5fa8dc; --c-data2:#a2cdee; --c-shared:#e69f00; --c-net:#1fb589; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
       font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 2px; }
h2 { font-size: 17px; margin: 34px 0 2px; }
h3 { font-size: 15px; margin: 0; }
.sub, .note { color: var(--muted); }
.sub { margin: 0 0 8px; }
.note { font-size: 12px; margin: 4px 0 0; }
.banner { padding: 8px 12px; border-radius: 6px; margin: 12px 0 0; border: 1px solid var(--warn); color: var(--warn); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 14px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
a.card { display: block; color: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s, transform .15s; }
a.card:hover, a.card:focus-visible { border-color: var(--bar); box-shadow: 0 2px 10px rgba(0, 0, 0, .08); transform: translateY(-1px); outline: none; }
.card .more { display: inline-flex; align-items: center; gap: 3px; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--bar); }
.card .more svg { display: block; }
html { scroll-behavior: smooth; }
.anchor { scroll-margin-top: 12px; margin: 0 -8px; padding: 0 8px 4px; border-radius: 8px; }
.anchor:target { animation: flash 2s ease-out; }
@keyframes flash { 0%, 35% { background: rgba(59, 130, 246, .13); } 100% { background: transparent; } }
.tip { border-bottom: 1px dotted currentColor; cursor: help; }
.tip:focus-visible { outline: 2px solid var(--bar); outline-offset: 2px; border-radius: 2px; }
.help { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; margin-left: 6px; flex: none;
        border: 1px solid currentColor; border-radius: 50%; color: var(--muted); cursor: help; user-select: none; vertical-align: 1px;
        font: 600 10px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.help:hover, .help:focus-visible { color: var(--bar); outline: none; }
#tooltip { position: fixed; z-index: 10; max-width: 340px; padding: 7px 10px; border-radius: 6px; background: var(--fg); color: var(--bg);
           font-size: 12px; line-height: 1.45; text-align: left; white-space: pre-line; pointer-events: none; opacity: 0; transition: opacity .12s; }
#tooltip.show { opacity: 1; }
.usage { margin: 8px 0 2px; }
.usage-text { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
.usage-text b { color: var(--fg); font-weight: 600; }
.usage-text b.pct.warn { color: var(--warn); } .usage-text b.pct.crit { color: var(--crit); }
.stack { display: flex; height: 14px; background: var(--track); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.stack .seg { flex: none; height: 100%; box-shadow: inset -1px 0 0 var(--bg); }
.stack .seg:hover { filter: brightness(1.15); }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; }
/* easter egg: click "panopticon" in the title */
main { position: relative; z-index: 1; }
.pano-word { cursor: pointer; border-radius: 3px; transition: color .6s; }
.pano-word:focus-visible { outline: 2px solid var(--bar); outline-offset: 2px; }
body.panopticon .pano-word { color: var(--bar); }
#pano-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; color: var(--fg);
           opacity: 0; transition: opacity 1.2s ease; }
body.panopticon #pano-bg { opacity: .08; }
@media (prefers-color-scheme: dark) { body.panopticon #pano-bg { opacity: .11; } }
#pano-bg svg { position: absolute; left: 50%; top: 50%; width: max(112vmin, 760px); height: auto; transform: translate(-50%, -50%); }
.card .role { color: var(--muted); font-size: 12px; }
.card .pct { font-size: 22px; font-weight: 600; margin-top: 2px; }
.card .detail { color: var(--muted); font-size: 12px; }
.track { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin: 6px 0 4px; }
.fill { height: 100%; background: var(--bar); }
.fill.warn { background: var(--warn); } .fill.crit { background: var(--crit); }
.pct.warn { color: var(--warn); } .pct.crit { color: var(--crit); }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
th:first-child, td:first-child { text-align: left; }
tr.muted td { color: var(--muted); }
tr.first-common td { border-top: 2px solid var(--border); }
tr.child td { font-size: 12px; padding-top: 3px; padding-bottom: 3px; }
tr.child td:first-child { padding-left: 26px; }
.minibar { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.minibar .track { width: 110px; margin: 0; flex: none; }
.up { color: var(--crit); } .down { color: var(--good); } .zero { color: var(--muted); }
.disk { margin-top: 18px; }
.chart { margin-top: 10px; }
.chart .plot > svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .grid { stroke: var(--border); stroke-width: 1; }
.hist-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 0; }
.range { display: inline-flex; margin-left: auto; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.range button { font: 500 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 3px 10px; border: 0;
                background: var(--card); color: var(--muted); cursor: pointer; }
.range button + button { border-left: 1px solid var(--border); }
.range button:hover { color: var(--fg); }
.range button[aria-pressed="true"] { background: var(--bar); color: #fff; }
.range button:focus-visible { outline: 2px solid var(--bar); outline-offset: -2px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend .lg-group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.legend .lg-group b { color: var(--fg); font-weight: 600; }
.legend .lg { display: inline-flex; align-items: center; gap: 5px; }
.legend .lg svg { display: block; overflow: visible; }
.g-root { --c: var(--c-root); } .g-shared { --c: var(--c-shared); } .g-net { --c: var(--c-net); }
.g-data.d0 { --c: var(--c-data0); } .g-data.d1 { --c: var(--c-data1); } .g-data.d2 { --c: var(--c-data2); }
.chart .ln { fill: none; stroke: var(--c); stroke-width: 2; }
.chart .mk { fill: var(--c); }
.chart .mk.ring { fill: var(--bg); stroke: var(--c); stroke-width: 1.8; }
.chart .hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: crosshair; }
.chart .series { transition: opacity .15s; }
.chart svg.hovering .series { opacity: .2; }
.chart svg.hovering .series.on { opacity: 1; }
.chart .series.on .ln { stroke-width: 3; }
code { font-size: 12px; }
</style>

<script>
(() => {
"use strict";
const app = document.getElementById("app");
let D = null;
try { D = JSON.parse(document.getElementById("data").textContent); } catch (e) {}
if (!D || !D.latest) { app.innerHTML = "<p>No data yet.</p>"; return; }
const L = D.latest, H = D.history || {};
const TZ = "Asia/Seoul", GiB = 1024 ** 3;

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const UNITS = ["B", "K", "M", "G", "T", "P"];
function fmt(b) {                       // like df -h / du -h: binary units, rounded up
  if (b == null) return "—";
  if (b === 0) return "0";
  let i = 0, v = Math.abs(b);
  while (v >= 1024 && i < UNITS.length - 1) { v /= 1024; i++; }
  let r = v >= 10 || i === 0 ? Math.ceil(v) : Math.ceil(v * 10) / 10;
  if (r >= 1024 && i < UNITS.length - 1) { i++; r = Math.ceil(r / 1024 * 10) / 10; }
  return (b < 0 ? "−" : "") + (r >= 10 || i === 0 ? r : r.toFixed(1)) + UNITS[i];
}
const pctText = p => Math.ceil(p * 100) + "%";   // df's Use% rounds up too
const sum = o => Object.values(o || {}).reduce((a, b) => a + (b || 0), 0);
const level = p => p >= 0.95 ? "crit" : p >= 0.85 ? "warn" : "";
const bar = (p, cls, color) => `<div class="track"><div class="fill ${cls ?? level(p)}" style="width:${Math.min(100, Math.max(0, p * 100)).toFixed(1)}%${color ? ";background:" + color : ""}"></div></div>`;
const minibar = (text, p, cls, color) => `<div class="minibar"><span>${text}</span>${bar(p, cls, color)}</div>`;

// ---- per-section disk usage: summary line + one bar split by user (scaled like df's Use%)
const PALETTE = ["#3b82f6", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6", "#06b6d4", "#ec4899", "#84cc16", "#f97316"];
const GREY = "#8b949e", LIGHT = "#b6bec9";
const sw = c => `<span class="sw" style="background:${c}"></span>`;
function userParts(sorted) {               // [[name, bytes]] largest first; users past the palette share one segment
  const parts = [], colors = {};
  sorted.forEach(([n, b], i) => {
    colors[n] = i < PALETTE.length ? PALETTE[i] : LIGHT;
    if (i < PALETTE.length) parts.push({label: n, bytes: b, color: PALETTE[i]});
  });
  const rest = sorted.slice(PALETTE.length);
  if (rest.length) parts.push({label: `${rest.length} other users`, bytes: rest.reduce((a, [, b]) => a + b, 0), color: LIGHT});
  return {parts, colors};
}
function usage(fs, parts) {
  const cap = fs.used + fs.avail, pct = fs.used / cap;
  const segs = parts.filter(p => p.bytes > 0).map(p =>
    `<span class="seg" style="width:${(p.bytes / cap * 100).toFixed(3)}%;background:${p.color}" data-tip="${esc(p.label + ": " + fmt(p.bytes))}"></span>`).join("");
  return `<div class="usage"><div class="usage-text"><span><b>${fmt(fs.used)}</b> used of ${fmt(fs.size)} · <b class="pct ${level(pct)}">${pctText(pct)}</b></span>
    <span><b>${fmt(fs.avail)}</b> free</span></div><div class="stack">${segs}</div></div>`;
}
function kst(dt) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {timeZone: TZ, year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23"}).formatToParts(dt).map(x => [x.type, x.value]));
  return {day: `${p.year}-${p.month}-${p.day}`, text: `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute} KST`};
}

// ---- change vs. ~7 days ago, from the daily history
const now = kst(new Date(L.generated_at));
const days = Object.keys(H).sort();
const targetDay = kst(new Date(Date.parse(now.day + "T12:00:00+09:00") - 7 * 86400e3)).day;
function baseDayOf(space) {   // ~7 days ago, or the oldest earlier day that has this space
  const older = days.filter(d => d < now.day && H[d][space]);
  if (!older.length) return null;
  const le = older.filter(d => d <= targetDay);
  return le.length ? le[le.length - 1] : older[0];
}
const dHead = space => { const b = baseDayOf(space);
  return !b || b === targetDay ? "7-day change" : `Change since ${b.slice(5).replace("-", "/")}`; };
function change(space, name, cur) {
  const baseDay = baseDayOf(space);
  if (!baseDay) return `<span class="zero">—</span>`;
  const d = cur - ((H[baseDay][space] || {})[name] || 0);
  if (Math.abs(d) < 0.5 * GiB) return `<span class="zero">0</span>`;
  return d > 0 ? `<span class="up">+${fmt(d)}</span>` : `<span class="down">${fmt(d)}</span>`;
}

// ---- explanations: "?" icons for sections and rows, dotted underlines for column headers (hover / focus / tap)
const tip = (label, text) => `<span class="tip" tabindex="0" data-tip="${esc(text)}">${label}</span>`;
const help = text => `<span class="help" tabindex="0" role="button" aria-label="${esc(text)}" data-tip="${esc(text)}">?</span>`;
const T = {
  about: `Read-only scan on aidas every hour at :05; this page updates about 15 min later.
Sizes as in df -h (1G = 1024³ bytes). /mnt/TrueNAS is included (its own scan); other network storage (/mnt/nas, /mnt/nasdata, /mnt/ece) is not.`,
  root: `Files each user owns anywhere on /, split by location. Only / has quotas.`,
  quota: `Usage counted toward the hard limit; writes fail at the limit. Should equal Total; if not, an admin can recount with quotacheck.`,
  data: `Everything inside each user's folder, whoever owns the files. The folders sit on three separate disks with no quotas, so one disk can fill up while others have room.`,
  shared: `Shared caches and software, reached via /mnt/data. No quotas.`,
  history: `% used per disk. 30 days: one point per day. 6 months: one point per week (its last daily scan).`,
  share: `Size ÷ (used + free); shares add up to the disk's %.`,
  total: `Bars are relative to the largest user.`,
  change: `Compared with 7 days ago (or the oldest day available). Under 0.5G shows as 0.`,
  na: `Used space that isn't in any file: filesystem metadata, or deleted files still held open by running programs.`,
  system: `Owned by root and system accounts (OS, software, logs).`,
  dataOther: `Outside the user folders (e.g. lost+found).`,
  docker: `Can't be split by user: Docker doesn't record who built an image.`,
  condaBase: `The shared miniconda3 install itself (everything except userenvs).`,
  rootOwned: `root's .cache, conda envs and Singularity files.`,
  sharedOther: `Other folders on this disk.`,
  net: `NFS share from the lab TrueNAS (10.210.100.200) on a direct 10G cable: network storage, but about as fast as a local disk. Separate scan every 6 hours: one pass over its millions of small files takes about an hour (no root needed). A top-level folder named after a user counts as theirs, whoever owns the files; other top-level folders are shared and shown with their largest sub-folders. No quotas.`,
  netShared: `A shared top-level folder (not named after a user).`,
  netOther: `Files directly in /mnt/TrueNAS.`,
  netNA: `Used space that isn't in any file: ZFS metadata and snapshots, or files deleted but still held open.`,
};
const changeTh = space => `<th>${tip(dHead(space), T.change)}</th>`;

// ---- header
const ageMin = (Date.now() - Date.parse(L.generated_at)) / 60000;
let html = `<h1>AIDAS-A100 storage <span id="pano-word" class="pano-word" role="button" tabindex="0" aria-pressed="false">panopticon</span></h1>
<p class="sub">Updated ${now.text} · scan took ${Math.max(1, Math.round(L.scan_seconds / 60))} min · refreshed hourly${help(T.about)}</p>`;
if (ageMin > 150) html += `<div class="banner">The last scan is ${Math.round(ageMin / 60)} hours old; the hourly update may be failing.</div>`;
if (!L.complete) html += `<div class="banner">Partial scan: some folders could not be read, so numbers are lower bounds.</div>`;

// ---- disk cards (each links to its detailed section)
const R = L.root_fs;
const anchorId = p => "disk-" + (p === "/" ? "root" : p.split("/").filter(Boolean).pop().replace(/[^A-Za-z0-9_-]/g, ""));
const disks = [["/", "System + home folders", R.fs, true]];
for (const [p, d] of Object.entries(L.data_disks)) disks.push([p, "User data folders", d.fs, d.mounted]);
for (const [p, d] of Object.entries(L.shared_disk)) disks.push([p, "Shared caches + conda", d.fs, d.mounted]);
const NET = L.network_disks || {};
for (const [p, d] of Object.entries(NET)) disks.push([p, "Network storage (10G NFS)", d.fs, d.mounted]);
const LINK_ICON = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`;
html += `<div class="cards">` + disks.map(([p, role, fs, mounted]) => {
  let body = `<div class="pct crit">not mounted</div>`;
  if (mounted) {
    const pct = fs.used / (fs.used + fs.avail);   // same as df's Use%
    body = `<div class="pct ${level(pct)}">${pctText(pct)}</div>${bar(pct)}
    <div class="detail">${fmt(fs.used)} of ${fmt(fs.size)} · <b>${fmt(fs.avail)} free</b></div>`;
  }
  return `<a class="card" href="#${anchorId(p)}" aria-label="${esc(p)}: show details"><b>${esc(p)}</b>
    <div class="role">${role}</div>${body}<span class="more">${LINK_ICON}<span aria-hidden="true">↓</span></span></a>`;
}).join("") + `</div>`;

// ---- /
const rootRows = Object.entries(R.users).map(([n, u]) =>
  ({n, u, t: (u.home || 0) + (u.tmp || 0) + (u.var_tmp || 0) + (u.other || 0)}))
  .filter(r => r.t > 0).sort((a, b) => b.t - a.t);
const S = R.system || {};
const rootU = userParts(rootRows.map(r => [r.n, r.t]));
html += `<section class="anchor" id="disk-root"><h2>/ (system disk)${help(T.root)}</h2>
${usage(R.fs, [...rootU.parts, {label: "System (root & services) + not attributable", bytes: sum(S) + R.unaccounted, color: GREY}])}
<div class="scroll"><table><tr><th>User</th><th>/home</th><th>/tmp</th><th>/var/tmp</th><th>Other</th><th>Total</th>
<th>${tip("Quota", T.quota)}</th>${changeTh("root")}</tr>`;
for (const {n, u, t} of rootRows) {
  let q = "—";
  if (u.quota_hard > 0) q = minibar(`${fmt(u.quota_used)} / ${fmt(u.quota_hard)}`, u.quota_used / u.quota_hard);
  else if (R.quota_available) q = `<span class="zero">no limit</span>`;
  html += `<tr><td>${sw(rootU.colors[n])}${esc(n)}</td><td>${fmt(u.home || 0)}</td><td>${fmt(u.tmp || 0)}</td><td>${fmt(u.var_tmp || 0)}</td>
    <td>${fmt(u.other || 0)}</td><td><b>${fmt(t)}</b></td><td>${q}</td><td>${change("root", n, t)}</td></tr>`;
}
html += `<tr class="muted first-common"><td>${sw(GREY)}System (root &amp; services)${help(T.system)}</td><td>${fmt(S.home || 0)}</td><td>${fmt(S.tmp || 0)}</td>
  <td>${fmt(S.var_tmp || 0)}</td><td>${fmt(S.other || 0)}</td><td>${fmt(sum(S))}</td><td></td><td></td></tr>
  <tr class="muted"><td>${sw(GREY)}Not attributable${help(T.na)}</td><td></td><td></td><td></td><td></td><td>${fmt(R.unaccounted)}</td><td></td><td></td></tr>
</table></div></section>`;

// ---- data folders
html += `<h2>Data folders (<code>/mnt/data/&lt;user&gt;</code>)${help(T.data)}</h2>`;
const withFolder = new Set();
for (const [p, d] of Object.entries(L.data_disks)) {
  if (!d.mounted) { html += `<div class="disk anchor" id="${anchorId(p)}"><h3>${esc(p)}: not mounted</h3></div>`; continue; }
  const rows = Object.entries(d.users).sort((a, b) => b[1] - a[1]);
  rows.forEach(([n]) => withFolder.add(n));
  const du = userParts(rows), cap = d.fs.used + d.fs.avail;
  html += `<div class="disk anchor" id="${anchorId(p)}"><h3>${esc(p)}</h3>
  ${usage(d.fs, [...du.parts, {label: "Other + not attributable", bytes: d.other + d.unaccounted, color: GREY}])}
  <div class="scroll"><table><tr><th>User</th><th>Size</th><th>${tip("Share of disk", T.share)}</th>${changeTh("data")}</tr>`;
  for (const [n, b] of rows)
    html += `<tr><td>${sw(du.colors[n])}${esc(n)}</td><td><b>${fmt(b)}</b></td><td>${minibar(Math.round(b / cap * 100) + "%", b / cap, "", du.colors[n])}</td><td>${change("data", n, b)}</td></tr>`;
  html += `<tr class="muted first-common"><td>${sw(GREY)}Other (not a user folder)${help(T.dataOther)}</td><td>${fmt(d.other)}</td><td></td><td></td></tr>
  <tr class="muted"><td>${sw(GREY)}Not attributable${help(T.na)}</td><td>${fmt(d.unaccounted)}</td><td></td><td></td></tr></table></div></div>`;
}
const noFolder = (L.users || []).filter(n => !withFolder.has(n));
if (noFolder.length) html += `<p class="note">No data folder: ${noFolder.map(esc).join(", ")}</p>`;

// ---- shared disk
for (const [p, d] of Object.entries(L.shared_disk)) {
  html += `<section class="anchor" id="${anchorId(p)}"><h2>Shared disk (<code>${esc(p)}</code>)${help(T.shared)}</h2>`;
  if (!d.mounted) { html += `<p class="note">Not mounted.</p></section>`; continue; }
  const rows = Object.entries(d.users).map(([n, u]) => ({n, u, t: sum(u)})).filter(r => r.t > 0).sort((a, b) => b.t - a.t);
  const max = Math.max(1, ...rows.map(r => r.t));
  const su = userParts(rows.map(r => [r.n, r.t]));
  html += usage(d.fs, [...su.parts, {label: "Common (Docker, conda base, root's files, other) + not attributable",
                                     bytes: sum(d.common) + d.unaccounted, color: GREY}]);
  html += `<div class="scroll"><table><tr><th>User</th>
    <th>${tip(".cache", "/mnt/data/.cache/<user>")}</th>
    <th>${tip("conda envs", "/mnt/data/miniconda3/userenvs/<user> (envs + package cache)")}</th>
    <th>${tip("Singularity", "/mnt/data/.singularity_cachedir/<user> + images the user owns in /mnt/data/singularity-images")}</th>
    <th>${tip("Total", T.total)}</th>${changeTh("shared")}</tr>`;
  for (const {n, u, t} of rows)
    html += `<tr><td>${sw(su.colors[n])}${esc(n)}</td><td>${fmt(u.cache)}</td><td>${fmt(u.conda)}</td><td>${fmt(u.singularity)}</td>
      <td>${minibar("<b>" + fmt(t) + "</b>", t / max, "", su.colors[n])}</td><td>${change("shared", n, t)}</td></tr>`;
  const C = d.common, labels = [["docker", "Docker (images, build cache)", T.docker], ["conda_base", "conda base install", T.condaBase],
    ["root", "root's caches, envs, images", T.rootOwned], ["other", "Other", T.sharedOther]];
  labels.forEach(([k, label, text], i) => {
    html += `<tr class="muted${i === 0 ? " first-common" : ""}"><td>${sw(GREY)}${label}${help(text)}</td><td></td><td></td><td></td><td>${fmt(C[k] || 0)}</td><td></td></tr>`;
  });
  html += `<tr class="muted"><td>${sw(GREY)}Not attributable${help(T.na)}</td><td></td><td></td><td></td><td>${fmt(d.unaccounted)}</td><td></td></tr></table></div></section>`;
}

// ---- network storage (/mnt/TrueNAS): user folders + shared folders, like the data disks
const SLATE = "#64748b";
for (const [p, d] of Object.entries(NET)) {
  const ageMin = (Date.now() - Date.parse(d.generated_at)) / 60000;
  html += `<section class="anchor" id="${anchorId(p)}"><h2>Network storage (<code>${esc(p)}</code>)${help(T.net)}</h2>
  <p class="sub">TrueNAS over NFS, direct 10G link · scanned ${kst(new Date(d.generated_at)).text} · scan took ${Math.max(1, Math.round(d.scan_seconds / 60))} min</p>`;
  if (ageMin > 780) html += `<div class="banner">The last ${esc(p)} scan is ${Math.round(ageMin / 60)} hours old; its 6-hourly scan may be failing.</div>`;
  if (!d.complete) html += `<div class="banner">Partial ${esc(p)} scan: some folders could not be read, so numbers are lower bounds.</div>`;
  const rows = Object.entries(d.users).sort((a, b) => b[1] - a[1]);
  const shared = Object.entries(d.shared).sort((a, b) => b[1].size - a[1].size);
  const nu = userParts(rows), cap = d.fs.used + d.fs.avail;
  const share = b => minibar(Math.round(b / cap * 100) + "%", b / cap, "", SLATE);
  html += usage(d.fs, [...nu.parts,
    ...shared.map(([n, f]) => ({label: `${n}/ (shared)`, bytes: f.size, color: SLATE})),
    {label: "Other + not attributable", bytes: d.other + d.unaccounted, color: GREY}]);
  html += `<div class="scroll"><table><tr><th>User / folder</th><th>Size</th><th>${tip("Share of disk", T.share)}</th>${changeTh("net")}</tr>`;
  for (const [n, b] of rows)
    html += `<tr><td>${sw(nu.colors[n])}${esc(n)}</td><td><b>${fmt(b)}</b></td><td>${minibar(Math.round(b / cap * 100) + "%", b / cap, "", nu.colors[n])}</td><td>${change("net", n, b)}</td></tr>`;
  shared.forEach(([n, f], i) => {
    html += `<tr class="${i === 0 ? "first-common" : ""}"><td>${sw(SLATE)}${esc(n)}/ <span class="zero">shared</span>${help(T.netShared)}</td><td><b>${fmt(f.size)}</b></td><td>${share(f.size)}</td><td></td></tr>`;
    for (const [c, b] of Object.entries(f.children).sort((a, b) => b[1] - a[1]))
      html += `<tr class="muted child"><td>└ ${esc(c)}</td><td>${fmt(b)}</td><td></td><td></td></tr>`;
    if (f.rest_count) html += `<tr class="muted child"><td>└ ${f.rest_count} more</td><td>${fmt(f.rest)}</td><td></td><td></td></tr>`;
  });
  html += `<tr class="muted${shared.length ? "" : " first-common"}"><td>${sw(GREY)}Other (top-level files)${help(T.netOther)}</td><td>${fmt(d.other)}</td><td></td><td></td></tr>
  <tr class="muted"><td>${sw(GREY)}Not attributable${help(T.netNA)}</td><td>${fmt(d.unaccounted)}</td><td></td><td></td></tr></table></div></section>`;
}

// ---- history chart: % used per disk. "30 days" (default): one point per day from the daily history;
// "6 months": one point per week (the week's last daily scan) from the weekly history.
// Grouped by disk type and colorblind-safe: hue = type (grey / blues / orange), shade + marker tell the data disks apart.
const WK = D.weekly || {};
const RANGES = {
  "30d": {label: "30 days", span: 29, points: () => days.map(d => ({day: d, snap: H[d]}))},
  "6m": {label: "6 months", span: 182, points: () => Object.keys(WK).sort()
    .map(w => ({day: kst(new Date(WK[w].generated_at)).day, week: w, snap: WK[w]}))},
};
html += `<h2 class="hist-head">Disk usage over time${help(T.history)}${days.length ? `<span class="range" role="group" aria-label="Time range">${
  Object.entries(RANGES).map(([k, r]) => `<button type="button" data-range="${k}" aria-pressed="${k === "30d"}">${r.label}</button>`).join("")}</span>` : ""}</h2>`;
let chart = null;   // the range on screen: {x, byName}
const dataDiskNames = Object.keys(L.data_disks);
const styleOf = n => {
  if (n === "/") return {cls: "g-root", label: "system disk", marker: "ring"};
  const i = dataDiskNames.indexOf(n);
  if (i >= 0) return {cls: `g-data d${i % 3}`, group: "data", label: "data disk", marker: ["circle", "square", "triangle"][i % 3]};
  if (n in NET) return {cls: "g-net", group: "net", label: "network storage", marker: "tdown"};
  return {cls: "g-shared", label: "shared disk", marker: "diamond"};
};
const marker = (m, cx, cy) => {
  const f = v => v.toFixed(1);
  if (m === "square") return `<rect class="mk" x="${f(cx - 3)}" y="${f(cy - 3)}" width="6" height="6"/>`;
  if (m === "triangle") return `<path class="mk" d="M${f(cx)} ${f(cy - 4)}L${f(cx + 3.8)} ${f(cy + 2.8)}L${f(cx - 3.8)} ${f(cy + 2.8)}Z"/>`;
  if (m === "tdown") return `<path class="mk" d="M${f(cx)} ${f(cy + 4)}L${f(cx + 3.8)} ${f(cy - 2.8)}L${f(cx - 3.8)} ${f(cy - 2.8)}Z"/>`;
  if (m === "diamond") return `<path class="mk" d="M${f(cx)} ${f(cy - 4.2)}L${f(cx + 4.2)} ${f(cy)}L${f(cx)} ${f(cy + 4.2)}L${f(cx - 4.2)} ${f(cy)}Z"/>`;
  if (m === "ring") return `<circle class="mk ring" cx="${f(cx)}" cy="${f(cy)}" r="3.4"/>`;
  return `<circle class="mk" cx="${f(cx)}" cy="${f(cy)}" r="3.2"/>`;
};
const shortName = n => n === "/" ? "/" : n.split("/").pop();
const md = day => day.slice(5).replace("-", "/");
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const names = disks.map(d => d[0]);
function drawChart(key) {
  const rg = RANGES[key], W = 800, Ht = 220, padL = 36, padR = 10, padT = 10, padB = 24;
  const endMs = Date.parse(now.day + "T12:00:00+09:00"), startMs = endMs - rg.span * 86400e3;
  const startDay = kst(new Date(startMs)).day;
  const x = day => padL + (Date.parse(day + "T12:00:00+09:00") - startMs) / (endMs - startMs) * (W - padL - padR);
  const pts = rg.points().filter(p => p.day >= startDay && p.day <= now.day);
  const byName = Object.fromEntries(names.map(n => [n, pts.map(p => {
    const f = (p.snap.fs || {})[n];
    return f ? {day: p.day, week: p.week, v: f.used / (f.used + f.avail)} : null;
  }).filter(Boolean)]));
  const all = Object.values(byName).flat().map(p => p.v);
  if (!all.length) return {svg: "", note: "No history yet.", x, byName};
  const yMin = Math.max(0, Math.floor((Math.min(...all) * 100 - 5) / 10) * 10) / 100;
  const y = v => padT + (1 - (v - yMin) / (1 - yMin)) * (Ht - padT - padB);
  let svg = `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Disk usage, last ${rg.label}">`;
  for (let g = Math.round(yMin * 100); g <= 100; g += 10)
    svg += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y(g / 100)}" y2="${y(g / 100)}"/><text x="${padL - 6}" y="${y(g / 100) + 4}" text-anchor="end">${g}%</text>`;
  const ticks = [];   // [day, label]: every 7 days, or each month start
  if (key === "30d") for (let i = 0; i < 28; i += 7) { const d = kst(new Date(startMs + i * 86400e3)).day; ticks.push([d, md(d)]); }
  else for (let [yr, mo] = startDay.split("-").map(Number); ; ) {
    if (++mo > 12) { mo = 1; yr++; }
    const d = `${yr}-${String(mo).padStart(2, "0")}-01`;
    if (d > now.day) break;
    ticks.push([d, MONTHS[mo - 1] + (mo === 1 ? ` '${String(yr).slice(2)}` : "")]);
  }
  for (const [d, label] of ticks)   // month labels keep clear of the y labels; all keep clear of today's label
    if ((key === "30d" || x(d) > padL + 12) && x(d) < x(now.day) - 44) svg += `<text x="${x(d)}" y="${Ht - 6}" text-anchor="middle">${label}</text>`;
  svg += `<text x="${x(now.day)}" y="${Ht - 6}" text-anchor="end">${md(now.day)}</text>`;
  for (const n of names) {
    const ps = byName[n], s = styleOf(n);
    if (!ps.length) continue;
    const poly = ps.map(p => `${x(p.day).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
    svg += `<g class="series ${s.cls}" data-series="${esc(n)}">
      <polyline class="ln" points="${poly}"/>
      ${ps.map(p => marker(s.marker, x(p.day), y(p.v))).join("")}
      <polyline class="hit" points="${poly}"/></g>`;
  }
  svg += `</svg>`;
  const first = pts.length ? pts[0].day : null, step = key === "30d" ? 1 : 7;
  const note = first && Date.parse(first) - Date.parse(startDay) > step * 86400e3 ? `History starts ${md(first)}.` : "";
  return {svg, note, x, byName};
}
if (!days.length) {
  html += `<p class="note">History starts with the first complete scan (one point per day).</p>`;
} else {
  const item = n => {
    const s = styleOf(n);
    return `<span class="lg ${s.cls}" data-series="${esc(n)}"><svg width="28" height="10" viewBox="0 0 28 10" aria-hidden="true">
      <line class="ln" x1="1" y1="5" x2="27" y2="5"/>${marker(s.marker, 14, 5)}</svg>${esc(shortName(n))}</span>`;
  };
  const groups = [["System", names.filter(n => n === "/")],
                  ["Data disks", names.filter(n => styleOf(n).group === "data")],
                  ["Shared", names.filter(n => n !== "/" && !styleOf(n).group)],
                  ["Network", names.filter(n => styleOf(n).group === "net")]];
  html += `<div class="chart"><div class="plot"></div><p class="note hist-note" hidden></p><div class="legend">${groups.filter(([, ns]) => ns.length)
    .map(([label, ns]) => `<span class="lg-group"><b>${label}</b>${ns.map(item).join("")}</span>`).join("")}</div></div>`;
}

app.innerHTML = html;

// ---- tooltips for [data-tip]: one floating element, so table scrolling can't clip it
const tipEl = document.createElement("div");
tipEl.id = "tooltip";
tipEl.setAttribute("role", "tooltip");
document.body.appendChild(tipEl);
function showTip(el) {
  tipEl.textContent = el.dataset.tip;
  tipEl.classList.add("show");
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8) + "px";
  // below the element, or above it when there is no room below
  tipEl.style.top = (r.bottom + 6 + h > window.innerHeight - 8 ? Math.max(8, r.top - 6 - h) : r.bottom + 6) + "px";
}
const hideTip = () => tipEl.classList.remove("show");
document.querySelectorAll("[data-tip]").forEach(el => {
  el.addEventListener("mouseenter", () => showTip(el));
  el.addEventListener("mouseleave", hideTip);
  el.addEventListener("focus", () => showTip(el));
  el.addEventListener("blur", hideTip);
  el.addEventListener("click", e => { e.stopPropagation(); showTip(el); });   // touch screens
});
document.addEventListener("click", hideTip);
window.addEventListener("scroll", hideTip, {passive: true});

// ---- history chart: the range switch, and hovering a line (or its legend entry) highlights it and labels it
function showTipAt(text, cx, cy) {
  tipEl.textContent = text;
  tipEl.classList.add("show");
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(8, Math.min(cx + 12, window.innerWidth - w - 8)) + "px";
  tipEl.style.top = (cy + 16 + h > window.innerHeight - 8 ? cy - 10 - h : cy + 16) + "px";
}
const plot = document.querySelector(".chart .plot"), histNote = document.querySelector(".hist-note");
const rangeBtns = document.querySelectorAll(".range button");
function showRange(key) {
  const c = drawChart(key);
  plot.innerHTML = c.svg;
  histNote.textContent = c.note;
  histNote.hidden = !c.note;
  chart = c;
  rangeBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.range === key)));
}
if (plot) {
  showRange("30d");
  rangeBtns.forEach(b => b.addEventListener("click", () => { hideTip(); showRange(b.dataset.range); }));
  const svgEl = () => plot.querySelector("svg");
  const highlight = name => {
    const s = svgEl();
    if (!s) return;
    s.classList.toggle("hovering", !!name);
    s.querySelectorAll(".series").forEach(g => g.classList.toggle("on", g.dataset.series === name));
  };
  const onChart = e => {
    const g = e.target.closest(".series"), s = svgEl();
    highlight(g ? g.dataset.series : null);
    if (!g || !s) { hideTip(); return; }
    const name = g.dataset.series, pts = chart.byName[name];
    const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(s.getScreenCTM().inverse());
    const q = pts.reduce((a, b) => Math.abs(chart.x(b.day) - p.x) < Math.abs(chart.x(a.day) - p.x) ? b : a);
    const when = q.week ? `Week of ${md(q.week)} (scan of ${md(q.day)})` : md(q.day);
    showTipAt(`${name} (${styleOf(name).label})\n${when}: ${(q.v * 100).toFixed(1)}% used`, e.clientX, e.clientY);
  };
  plot.addEventListener("mousemove", onChart);
  plot.addEventListener("click", e => { e.stopPropagation(); onChart(e); });   // touch screens
  plot.addEventListener("mouseleave", () => { highlight(null); hideTip(); });
  document.querySelectorAll(".legend .lg").forEach(item => {
    item.addEventListener("mouseenter", () => highlight(item.dataset.series));
    item.addEventListener("mouseleave", () => highlight(null));
  });
}

// ---- easter egg: "panopticon" in the title toggles a faint panopticon floor plan behind the page
function panopticonSVG(still) {
  const RO = 470, RC = 350, RG = 325, RT = 96, RTI = 70, N = 48, f = v => v.toFixed(1);
  const pt = (r, t) => `${f(r * Math.cos(t))} ${f(r * Math.sin(t))}`;   // polar -> "x y"
  let s = `<svg viewBox="-500 -500 1000 1000" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <defs><radialGradient id="pano-beam" cx="0" cy="0" r="${RO}" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="currentColor" stop-opacity=".9"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></radialGradient>
      <clipPath id="pano-eye-clip"><path d="M-46 0 Q0 -36 46 0 Q0 36 -46 0 Z"/></clipPath></defs>`;
  const a = 7 * Math.PI / 180;   // the tower's searchlight sweeping the cells
  s += `<g><path d="M0 0 L${pt(RO, -a)} A${RO} ${RO} 0 0 1 ${pt(RO, a)} Z" fill="url(#pano-beam)" stroke="none"/>` +
       (still ? "" : `<animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="48s" repeatCount="indefinite"/>`) + `</g>`;
  // outer wall, ring of cells (with grated fronts), gallery
  s += `<circle r="${RO}" stroke-width="5"/><circle r="${RO - 12}"/><circle r="${RC}" stroke-width="3"/>
    <circle r="${RC + 9}" stroke-dasharray="2 7"/><circle r="${RG}" stroke-dasharray="6 10"/>`;
  for (let i = 0; i < N; i++) { const t = i / N * 2 * Math.PI; s += `<path d="M${pt(RC, t)} L${pt(RO - 12, t)}"/>`; }
  for (let i = 0; i < 4; i++) {   // bridges from the tower to the gallery (parallel rails)
    const t = Math.PI / 4 + i * Math.PI / 2, o = 0.05, og = o * RT / RG;
    s += `<path d="M${pt(RT, t - o)} L${pt(RG, t - og)} M${pt(RT, t + o)} L${pt(RG, t + og)}"/>`;
  }
  // the inspection tower with its window slits, and the eye
  s += `<circle r="${RT}" stroke-width="4"/><circle r="${RTI}"/>`;
  for (let i = 0; i < 16; i++) { const t = i / 16 * 2 * Math.PI; s += `<path d="M${pt(RTI + 6, t)} L${pt(RT - 6, t)}" stroke-width="3"/>`; }
  s += `<g>${still ? "" : `<animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 .08;1 1" keyTimes="0;.93;.965;1" dur="6s" repeatCount="indefinite"/>`}
    <path d="M-46 0 Q0 -36 46 0 Q0 36 -46 0 Z" stroke-width="3"/>
    <g clip-path="url(#pano-eye-clip)"><g id="pano-iris"><circle r="15" stroke-width="3"/><circle r="6" fill="currentColor" stroke="none"/></g></g></g>`;
  return s + `</svg>`;
}
const word = document.getElementById("pano-word"), PANO_KEY = "aidas-panopticon", f1 = v => v.toFixed(1);
function setPanopticon(on) {
  if (on && !document.getElementById("pano-bg")) {
    const bg = document.createElement("div");
    bg.id = "pano-bg";
    bg.innerHTML = panopticonSVG(matchMedia("(prefers-reduced-motion: reduce)").matches);
    document.body.prepend(bg);
    void bg.offsetWidth;                         // start from opacity 0 so it fades in
  }
  document.body.classList.toggle("panopticon", on);
  word.setAttribute("aria-pressed", String(on));
  try { localStorage.setItem(PANO_KEY, on ? "1" : "0"); } catch (e) {}
}
word.addEventListener("click", () => setPanopticon(!document.body.classList.contains("panopticon")));
word.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); word.click(); } });
document.addEventListener("mousemove", e => {   // the tower's eye follows the cursor
  const iris = document.body.classList.contains("panopticon") && document.getElementById("pano-iris");
  if (!iris) return;
  const dx = e.clientX - innerWidth / 2, dy = e.clientY - innerHeight / 2, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 320);
  iris.setAttribute("transform", `translate(${f1(dx / d * 24 * k)} ${f1(dy / d * 8 * k)})`);
});
try { if (localStorage.getItem(PANO_KEY) === "1") setPanopticon(true); } catch (e) {}
})();
</script>
